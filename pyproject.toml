[project]
name = "mailtui"
version = "0.1.0"
description = "A local-first terminal mail client"
requires-python = ">=3.12"
dependencies = [
  "textual>=8.2",
  "beautifulsoup4>=4.12",
  "platformdirs>=4.0",
  "imap-tools>=1.16.0",
  "aiosmtplib>=5.1.3",
  "keyring>=25.7.0",
  "tomli-w>=1.2.0",
  "textual-image>=0.14.4",
]

[project.scripts]
mail = "mailtui.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailtui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
